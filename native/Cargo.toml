[package]
name = "gamdl-native"
version = "4.0.0"
edition = "2024"
license = "MIT"
description = "Native MP4 processing for Gamdl"
repository = "https://github.com/glomatico/gamdl"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310"] }
mp4ameta = "0.13"
id3 = "1"
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
aes = "0.8"
ctr = "0.9"
