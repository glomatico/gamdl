# Build precompiled, Python 3.10+ ABI3 wheels before a PyPI release.
# Manual runs validate distributions without publishing, unless the explicit
# missing-sdist recovery option is enabled.
name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_missing_sdist:
        description: "Recovery only: upload a missing sdist for an existing PyPI release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-release:
    name: Check package and release versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify release tag matches pyproject.toml
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ.get("RELEASE_TAG")
          if tag and tag not in (version, f"v{version}"):
              raise SystemExit(f"Release tag {tag!r} does not match version {version!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
          PY

  build-sdist:
    name: Build source distribution
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build source distribution
        run: |
          python -m pip install "maturin==1.11.5"
          maturin sdist --out dist
      - name: Verify source distribution includes its license
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path

          archive, = Path("dist").glob("gamdl-*.tar.gz")
          with tarfile.open(archive, "r:gz") as source:
              expected = f"{archive.name.removesuffix('.tar.gz')}/LICENSE"
              assert expected in source.getnames(), f"Missing {expected} in {archive}"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Wheel ${{ matrix.name }}
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_missing_sdist }}
    needs: validate-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            python: "3.10"
            interpreter: python3.10
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            python: "3.10"
            interpreter: python3.10
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
          - name: windows-x86_64
            os: windows-latest
            python: "3.10"
            interpreter: python
            target: x86_64-pc-windows-msvc
            manylinux: "off"
          - name: windows-arm64
            os: windows-11-arm
            python: "3.12"
            interpreter: python
            target: aarch64-pc-windows-msvc
            manylinux: "off"
          - name: macos-universal2
            os: macos-latest
            python: "3.10"
            interpreter: python
            target: universal2-apple-darwin
            manylinux: "off"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Rust for native runner builds
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
      - name: Add Intel target for macOS universal2
        if: matrix.name == 'macos-universal2'
        run: rustup target add x86_64-apple-darwin

      # A native Ubuntu build cannot reliably produce a PyPI-compatible
      # manylinux wheel. The action builds in a manylinux2014 container.
      - name: Build native wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.11.5
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist -i ${{ matrix.interpreter }}

      - name: Check ABI3 wheel and bundled native extension
        run: |
          python -c "from pathlib import Path; import zipfile; wheels=list(Path('dist').glob('gamdl-*.whl')); assert len(wheels)==1, wheels; wheel=wheels[0]; assert 'cp310-abi3' in wheel.name, wheel.name; members=zipfile.ZipFile(wheel).namelist(); assert any(p.startswith('gamdl/_native.') and p.endswith(('.so', '.pyd')) for p in members), members"
      - name: Install and smoke-test the built wheel
        run: |
          python -c "from pathlib import Path; import subprocess,sys; wheel,=Path('dist').glob('gamdl-*.whl'); subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheel)])"
          python -c "import gamdl; from gamdl import _native; from importlib.metadata import version; assert version('gamdl') == '${{ needs.validate-release.outputs.version }}'; assert callable(_native.remux_mp4)"
          gamdl --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  verify-distributions:
    name: Verify release artifacts
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_missing_sdist }}
    needs: [validate-release, build-sdist, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check distribution metadata and platform coverage
        env:
          PACKAGE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          python -m pip install twine
          python -m twine check dist/*
          python - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          wheels = list(Path("dist").glob("gamdl-*.whl"))
          sdists = list(Path("dist").glob("gamdl-*.tar.gz"))
          assert len(wheels) == 5 and len(sdists) == 1, (wheels, sdists)
          assert all(p.name.startswith(f"gamdl-{version}-") for p in wheels)
          assert sdists[0].name == f"gamdl-{version}.tar.gz"
          with tarfile.open(sdists[0], "r:gz") as archive:
              assert f"gamdl-{version}/LICENSE" in archive.getnames()
          names = [wheel.name for wheel in wheels]
          assert all("cp310-abi3" in name for name in names), names
          assert any("manylinux" in n and "x86_64" in n for n in names), names
          assert any("manylinux" in n and "aarch64" in n for n in names), names
          assert any("win_amd64" in n for n in names), names
          assert any("win_arm64" in n for n in names), names
          assert any("macosx" in n and "universal2" in n for n in names), names
          PY

  pypi-publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: verify-distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gamdl/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  pypi-recover-sdist:
    name: Recover missing PyPI source distribution
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_missing_sdist }}
    needs: [validate-release, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gamdl/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-sdist
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify an existing PyPI release is missing only its sdist
        env:
          PACKAGE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          assert [p.name for p in Path("dist").iterdir()] == [
              f"gamdl-{version}.tar.gz"
          ], "Recovery must publish exactly one source distribution"
          with urllib.request.urlopen(
              f"https://pypi.org/pypi/gamdl/{version}/json", timeout=15
          ) as response:
              release = json.load(response)
          files = [entry["filename"] for entry in release["urls"]]
          assert len([name for name in files if name.endswith(".whl")]) == 5, files
          assert not any(name.endswith(".tar.gz") for name in files), files
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
